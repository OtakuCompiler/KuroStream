name: KuroHub CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'kurohub/**'
      - '.github/workflows/kurohub-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kurohub/**'
      - '.github/workflows/kurohub-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: KuroHub Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kurohub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kurohub/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kurohub-dist
          path: kurohub/dist/
          retention-days: 14

  typecheck:
    name: KuroHub Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kurohub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kurohub/package.json
      - name: Install dependencies
        run: npm install
      - name: Run typecheck
        run: npx tsc --noEmit

  arctic-web-build:
    name: Arctic Web App Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kurohub/Kurostream web app/Kurostream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: arctic-web-dist
          path: kurohub/Kurostream web app/Kurostream/dist/
          retention-days: 14
