name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Run ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run detekt
        run: ./gradlew detekt --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --max-workers=2

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble Debug
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  assemble-release:
    name: Assemble Release AAB
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE }}" | base64 -d > upload-keystore.jks
        if: github.event_name == 'release'

      - name: Assemble Release
        run: ./gradlew :app:bundleRelease --no-daemon --max-workers=2
        env:
          UPLOAD_KEYSTORE_PATH: upload-keystore.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/*.aab

      - name: Verify 16KB page size
        run: |
          unzip -l app/build/outputs/bundle/release/*.aab | grep "lib/arm64-v8a" | grep -v "16384" && echo "ERROR: 16KB page size not configured" && exit 1 || echo "16KB page size verified"
          readelf -l app/build/intermediates/merged_native_libs/release/out/lib/arm64-v8a/*.so | grep "16384" && echo "ELF 16KB verified" || echo "WARNING: ELF check needs manual verification"

  deploy-internal:
    name: Deploy to Internal Testing
    runs-on: ubuntu-latest
    needs: assemble-release
    if: github.event_name == 'release'
    steps:
      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: artifacts/

      - name: Upload to Play Console Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.kurostream.app
          releaseFiles: artifacts/*.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2

  deploy-server:
    name: Deploy Backend Server
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: kurostream-server
          region: us-central1
          image: gcr.io/${{ secrets.GCP_PROJECT }}/kurostream-server
          env_vars: |
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            GOOGLE_CLOUD_PROJECT_NUMBER=${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
            PORT=3000
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-test, assemble-debug, assemble-release, deploy-internal, deploy-server]
    if: failure()
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#kurostream-builds'
          text: 'Build failed for KuroStream'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}