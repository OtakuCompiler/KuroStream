name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 35
        build-tools: 35.0.0
        ndk: 27.1.12297006
        cmake: 3.22.1

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: false
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Grant execute permission to gradlew
      run: chmod +x ./gradlew

    - name: Run unit tests
      run: ./gradlew test --no-daemon --stacktrace

    - name: Run lint
      run: ./gradlew lintDebug --no-daemon --stacktrace

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Build release bundle (unsigned)
      run: ./gradlew bundleRelease --no-daemon --stacktrace

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk-${{ github.sha }}
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
        compression-level: 1

    - name: Upload release bundle
      uses: actions/upload-artifact@v4
      with:
        name: release-bundle-${{ github.sha }}
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 30
        compression-level: 1

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ github.sha }}
        path: |
          app/build/reports/tests/
          **/build/reports/tests/
        retention-days: 14

  metadata-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify required metadata files
      run: |
        for f in README.md LICENSE SECURITY.md CONTRIBUTING.md; do
          test -f "$f" || { echo "Missing: $f"; exit 1; }
        done
        echo "All required metadata files present."
