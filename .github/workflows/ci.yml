name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 35
        build-tools: 35.0.0
        ndk: 27.1.12297006
        cmake: 3.22.1

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: false
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Grant execute permission to gradlew
      run: chmod +x ./gradlew

    - name: Run Detekt (static analysis)
      run: ./gradlew detekt --no-daemon --stacktrace
      continue-on-error: false

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Build release bundle (unsigned)
      run: ./gradlew bundleRelease --no-daemon --stacktrace

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk-${{ github.sha }}
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
        compression-level: 1

    - name: Upload release bundle
      uses: actions/upload-artifact@v4
      with:
        name: release-bundle-${{ github.sha }}
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 30
        compression-level: 1

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ github.sha }}
        path: |
          app/build/reports/tests/
          **/build/reports/
        retention-days: 14

    - name: Upload detekt reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: detekt-report-${{ github.sha }}
        path: |
          build/reports/detekt/
          **/build/reports/detekt/
        retention-days: 30

  metadata-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify metadata files
      run: |
        test -f README.md || (echo "Missing README.md" && exit 1)
        test -f LICENSE || (echo "Missing LICENSE" && exit 1)
        test -f SECURITY.md || (echo "Missing SECURITY.md" && exit 1)
        test -f CONTRIBUTING.md || (echo "Missing CONTRIBUTING.md" && exit 1)
        echo "All required metadata files present."
