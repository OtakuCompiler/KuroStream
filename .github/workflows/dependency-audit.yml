name: Dependency Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  audit-android:
    name: Android Dependencies Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate dependency report
        run: |
          bash gradlew dependencies --configuration releaseRuntimeClasspath --no-daemon --max-workers=2 \
            > /tmp/deps.txt 2>&1 || true
        continue-on-error: true
      - name: Check for outdated plugins
        run: bash gradlew :app:dependencyUpdates -no-daemon || true
        continue-on-error: true
      - name: Generate audit report
        if: always()
        run: |
          {
            echo "## Android dependency audit report"
            echo "Generated $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "### Top-level dependencies (releaseRuntimeClasspath)"
            head -200 /tmp/deps.txt 2>/dev/null || echo "(unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
