name: Dependency Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  audit-web:
    name: Web Dependencies Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kurohub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kurohub/package.json
      - name: Install dependencies
        run: npm install --no-audit
      - name: Run npm audit (warn-only)
        run: npm audit --audit-level=critical || true
        continue-on-error: true
      - name: Check for outdated dependencies
        run: npm outdated || true
        continue-on-error: true
      - name: Generate audit report
        if: always()
        run: |
          {
            echo "## npm audit report"
            echo "Generated $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "### Vulnerabilities"
            npm audit --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); m=d.get('metadata',{}).get('vulnerabilities',{}); print('  Total:', m);" || echo "  npm audit unavailable"
            echo ""
            echo "### Outdated packages"
            npm outdated || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  audit-android:
    name: Android Dependencies Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate dependency report
        run: |
          bash gradlew dependencies --configuration releaseRuntimeClasspath --no-daemon --max-workers=2 \
            > /tmp/deps.txt 2>&1 || true
        continue-on-error: true
      - name: Check for outdated plugins
        run: bash gradlew :app:dependencyUpdates -no-daemon || true
        continue-on-error: true
      - name: Generate audit report
        if: always()
        run: |
          {
            echo "## Android dependency audit report"
            echo "Generated $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "### Top-level dependencies (releaseRuntimeClasspath)"
            head -200 /tmp/deps.txt 2>/dev/null || echo "(unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
