name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"
      KOTLIN_DAEMON_JVMARGS: "-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 35
        build-tools: 35.0.0
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Run Lint
      run: ./gradlew lintDebug --no-daemon --stacktrace --no-parallel
    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-report-${{ github.sha }}
        path: |
          app/build/reports/lint-results-debug.html
          **/build/reports/lint-results*.html
        retention-days: 30
        compression-level: 1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"
      KOTLIN_DAEMON_JVMARGS: "-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 35
        build-tools: 35.0.0
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Run unit tests
      run: ./gradlew test --no-daemon --stacktrace --no-parallel
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ github.sha }}
        path: |
          app/build/reports/tests/
          **/build/reports/tests/
        retention-days: 14
