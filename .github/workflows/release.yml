name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "35.0.0"
      - name: Decode signing key
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > upload-keystore.jks
      - run: bash gradlew :app:bundleRelease --no-daemon --max-workers=2
        env:
          UPLOAD_KEYSTORE_PATH: upload-keystore.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: app/build/outputs/bundle/release/*.aab
