name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"
      KOTLIN_DAEMON_JVMARGS: "-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          api-level: 36
      - name: Create google-services.json stub
        run: |
          mkdir -p app/src/release
          cat > app/src/release/google-services.json << 'STUB'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "kurostream-placeholder",
              "storage_bucket": "kurostream-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.kurostream.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyPlaceholderKeyForCIOnly123456"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          STUB
      - name: Decode signing key
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > upload-keystore.jks
          else
            echo "No signing key configured — building unsigned release"
          fi
      - run: bash gradlew :app:bundleRelease --no-daemon --max-workers=4 -Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        env:
          UPLOAD_KEYSTORE_PATH: upload-keystore.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/mapping/**
          retention-days: 7
