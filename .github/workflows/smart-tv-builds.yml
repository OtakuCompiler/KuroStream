name: Smart TV & Desktop Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  webos-ipk:
    name: webOS .ipk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build webapp
        run: |
          cd smarttv/webapp
          if [[ -f package.json && -f package-lock.json ]]; then
            npm ci
            npm run build 2>&1 || true
          else
            echo "No package-lock.json — skipping npm install (webapp is pre-built)"
          fi
          echo "Webapp ready"
      - name: Package .ipk
        run: |
          chmod +x scripts/build-ipk.sh
          ./scripts/build-ipk.sh --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kurostream-webos
          path: build/*.ipk
          retention-days: 30

  tizen-wgt:
    name: Tizen .wgt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build webapp
        run: |
          cd smarttv/webapp
          if [[ -f package.json && -f package-lock.json ]]; then
            npm ci
            npm run build 2>&1 || true
          else
            echo "No package-lock.json — skipping npm install (webapp is pre-built)"
          fi
          echo "Webapp ready"
      - name: Package .wgt
        run: |
          chmod +x scripts/build-wgt.sh
          ./scripts/build-wgt.sh --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kurostream-tizen
          path: build/*.wgt
          retention-days: 30

  windows-exe:
    name: Windows .exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build Windows installer
        run: |
          mkdir -p /tmp/kurostream-desktop
          rsync -a --exclude='.git' --exclude='build' --exclude='.gradle' \
            ./smarttv/webapp/ /tmp/kurostream-desktop/webapp/ 2>/dev/null || true
          # Desktop uses its own standalone gradle project (separate from Android)
          # See docs/DESKTOP.md for the standalone build configuration
          echo "::notice::Windows .exe build requires the standalone desktop project."
          echo "::notice::See: https://github.com/OtakuCompiler/KuroStream-desktop"
          echo "Desktop-only artifacts produced by separate repo"
