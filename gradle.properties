# KuroStream — tuned for Snapdragon 680 / 6GB RAM device (Termux proot)
# Heap caps are deliberate: 8GB+ requests caused swap thrash and OOM kills on this phone.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.daemon.idletimeout=1800000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.workers.max=2
org.gradle.vfs.watch=false
# AAPT2 persistent daemons fail to start under proot with parallel workers;
# spawn an aapt2 process per task instead (reliable, still parallel).
android.aapt2daemonMode=outofprocess
# Use the SDK's native arm64 aapt2 (Google's maven aapt2 is x86_64-only
# and cannot exec on this aarch64 host).
android.aapt2FromMavenOverride=/root/Android/Sdk/build-tools/35.0.0/aapt2
# Project .gradle dir (config cache store) on internal storage, not FUSE sdcard
android.enableR8.fullMode=true
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC
ksp.incremental=true

android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=true
android.enableDependencyVerification=false
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
android.maxAapt2Daemons=2
