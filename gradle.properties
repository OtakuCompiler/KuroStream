# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dorg.sqlite.lib.path=/data/data/com.termux/files/home/.gradle/native-libs -Dorg.sqlite.lib.name=libsqlitejdbc.so -Djava.library.path=/data/data/com.termux/files/home/.gradle/native-libs
