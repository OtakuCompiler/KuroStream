# KuroStream — tuned for Snapdragon 680 / 6GB RAM device (Termux proot)
# Heap caps are deliberate: 8GB+ requests caused swap thrash and OOM kills on this phone.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=64m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.workers.max=1
org.gradle.vfs.watch=false
# AAPT2 runs through x86→arm64 translation (ndk_translation); serialize transforms
# to prevent translation-layer contention and OOM from multiple aapt2 processes.
android.aapt2daemonMode=outofprocess
android.maxAapt2Daemons=1
android.aapt2FromMavenOverride=
android.enableR8.fullMode=true
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=192m -Dfile.encoding=UTF-8
ksp.incremental=true

android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=true
android.enableDependencyVerification=false
android.suppressUnsupportedCompileSdk=36
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
