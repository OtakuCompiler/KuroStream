# Project-wide Gradle settings optimized for Snapdragon 680 (8-core ARM64)
# - 4 Gradle workers to keep CPU/thermal headroom
# - 4 GB heap to stay within typical 6 GB device RAM
# - Parallel GC for multi-core throughput
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.workers.max=4
org.gradle.logging.level=quiet
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.caching.enabled=true
kotlin.daemon.enabled=true
kotlin.compiler.execution.strategy=out-of-process
kotlin.daemon.jvmargs=-Xmx1g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m

# KSP
ksp.incremental=true
ksp.incremental.log=true

# Compose
android.enableComposeCompilerMetrics=true
android.enableComposeCompilerReports=true

# Kotlin Multiplatform AGP compatibility
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
