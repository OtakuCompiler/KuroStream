# Project-wide Gradle settings - conservative for Termux/proot/low-RAM devices
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.workers.max=1
org.gradle.logging.level=quiet
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Android
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.experimental.cacheCompileResults=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.caching.enabled=true
kotlin.daemon.jvmargs=-Xmx768m -XX:+UseG1GC -XX:MaxMetaspaceSize=128m

# KSP
ksp.incremental=true
ksp.incremental.log=true

# Compose
android.enableComposeCompilerMetrics=true
android.enableComposeCompilerReports=true

# Kotlin Multiplatform AGP compatibility
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
