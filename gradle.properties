# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=true
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.logging.level=quiet
org.gradle.configuration-cache=false

# Android
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.caching.enabled=false
kotlin.daemon.enabled=false
kotlin.daemon.jvmargs=-Xmx512m -XX:+UseG1GC -XX:MaxMetaspaceSize=256m

# KSP
ksp.incremental=false
ksp.incremental.log=false

# Compose
android.enableComposeCompilerMetrics=false
android.enableComposeCompilerReports=false

# Kotlin Multiplatform AGP compatibility
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
